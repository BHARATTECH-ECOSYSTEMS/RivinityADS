# LiteAds Production Configuration

app:
  debug: false

server:
  workers: 4
  reload: false

database:
  pool_size: 20
  max_overflow: 40

redis:
  pool_size: 20

ad_serving:
  timeout_ms: 30
  enable_ml_prediction: false
  prediction_mode: "statistical"
  prediction_timeout_ms: 20.0

logging:
  level: "INFO"
  format: "json"

monitoring:
  enabled: true
