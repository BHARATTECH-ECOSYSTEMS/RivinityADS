# LiteAds Development Configuration

app:
  debug: true

server:
  workers: 1
  reload: true

database:
  host: "localhost"
  port: 5432
  name: "liteads"
  user: "liteads"
  password: "liteads_password"

redis:
  host: "localhost"
  port: 6379
  db: 1

ad_serving:
  enable_ml_prediction: false
  prediction_mode: "statistical"
  model_path: "models/lr_ctr.pt"
  prediction_timeout_ms: 20.0

logging:
  level: "DEBUG"
  format: "console"

monitoring:
  enabled: false
