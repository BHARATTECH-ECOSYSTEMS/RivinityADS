# LiteAds Local / Development Docker Compose
# WARNING: DO NOT USE IN PRODUCTION WITHOUT SETTING ENVIRONMENT SECRETS.
# FOR PRODUCTION DEPLOYMENTS, USE: docker compose -f docker-compose.prod.yml up -d

services:
  # Ad Server (can be scaled horizontally)
  ad-server:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "${LITEADS_PORT_BINDING:-127.0.0.1:8000}:8000"
    environment:
      - LITEADS_ENV=${LITEADS_ENV:-dev}
      - LITEADS_DATABASE__HOST=${LITEADS_DATABASE__HOST:-postgres}
      - LITEADS_DATABASE__PORT=${LITEADS_DATABASE__PORT:-5432}
      - LITEADS_DATABASE__NAME=${LITEADS_DATABASE__NAME:-liteads}
      - LITEADS_DATABASE__USER=${LITEADS_DATABASE__USER:-liteads}
      - LITEADS_DATABASE__PASSWORD=${LITEADS_DATABASE__PASSWORD:?LITEADS_DATABASE__PASSWORD must be set}
      - LITEADS_REDIS__HOST=${LITEADS_REDIS__HOST:-redis}
      - LITEADS_REDIS__PORT=${LITEADS_REDIS__PORT:-6379}
      - LITEADS_REDIS__PASSWORD=${LITEADS_REDIS__PASSWORD:-}
      - LITEADS_AUTH__JWT_SECRET=${LITEADS_AUTH__JWT_SECRET}
      - LITEADS_TRACKING__SECRET=${LITEADS_TRACKING__SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LAYA_BASE_URL=http://laya:8000
      - LITEADS_EMAIL__HOST=mailpit
      - LITEADS_EMAIL__PORT=1025
      - LITEADS_EMAIL__USER=
      - LITEADS_EMAIL__PASSWORD=
      - LITEADS_EMAIL__USE_TLS=false
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - LITEADS_SERVER__TRUSTED_PROXIES=${LITEADS_SERVER__TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      # Deployment Topology:
      # - Monolith Mode (default): 'docker compose up' runs in-process schedulers inside ad-server.
      # - Dedicated Worker Mode: when running with '--profile worker', set LITEADS_ENABLE_OPTIMIZATION_WORKER=false
      #   and LITEADS_ENABLE_WEBHOOK_WORKER=false to prevent redundant dual scheduler loops.
      - LITEADS_ENABLE_WEBHOOK_WORKER=${LITEADS_ENABLE_WEBHOOK_WORKER:-true}
      - LITEADS_ENABLE_OPTIMIZATION_WORKER=${LITEADS_ENABLE_OPTIMIZATION_WORKER:-true}
      - LITEADS_ENABLE_NOTIFICATION_WORKER=${LITEADS_ENABLE_NOTIFICATION_WORKER:-true}
      - LITEADS_OPTIMIZATION__MODE=${LITEADS_OPTIMIZATION__MODE:-suggestions_only}
      - LITEADS_OPTIMIZATION__KILL_SWITCH=${LITEADS_OPTIMIZATION__KILL_SWITCH:-false}
      - LITEADS_OPTIMIZATION__INTERVAL_SECONDS=${LITEADS_OPTIMIZATION__INTERVAL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - liteads-network


  # Webhook Outbox Worker (dedicated worker process)
  webhook-worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    command: ["python", "-m", "liteads.ad_server.services.webhook_worker"]
    environment:
      - LITEADS_ENV=${LITEADS_ENV:-dev}
      - LITEADS_DATABASE__HOST=${LITEADS_DATABASE__HOST:-postgres}
      - LITEADS_DATABASE__PORT=${LITEADS_DATABASE__PORT:-5432}
      - LITEADS_DATABASE__NAME=${LITEADS_DATABASE__NAME:-liteads}
      - LITEADS_DATABASE__USER=${LITEADS_DATABASE__USER:-liteads}
      - LITEADS_DATABASE__PASSWORD=${LITEADS_DATABASE__PASSWORD:?LITEADS_DATABASE__PASSWORD must be set}
      - LITEADS_REDIS__HOST=${LITEADS_REDIS__HOST:-redis}
      - LITEADS_REDIS__PORT=${LITEADS_REDIS__PORT:-6379}
      - LITEADS_REDIS__PASSWORD=${LITEADS_REDIS__PASSWORD:-}
      - LITEADS_AUTH__JWT_SECRET=${LITEADS_AUTH__JWT_SECRET}
      - LITEADS_TRACKING__SECRET=${LITEADS_TRACKING__SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - liteads-network
    profiles:
      - worker


  # Campaign Optimization Worker (dedicated worker process)
  optimization-worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    command: ["python", "-m", "liteads.ad_server.services.optimization_worker"]
    environment:
      - LITEADS_ENV=${LITEADS_ENV:-dev}
      - LITEADS_DATABASE__HOST=${LITEADS_DATABASE__HOST:-postgres}
      - LITEADS_DATABASE__PORT=${LITEADS_DATABASE__PORT:-5432}
      - LITEADS_DATABASE__NAME=${LITEADS_DATABASE__NAME:-liteads}
      - LITEADS_DATABASE__USER=${LITEADS_DATABASE__USER:-liteads}
      - LITEADS_DATABASE__PASSWORD=${LITEADS_DATABASE__PASSWORD:?LITEADS_DATABASE__PASSWORD must be set}
      - LITEADS_REDIS__HOST=${LITEADS_REDIS__HOST:-redis}
      - LITEADS_REDIS__PORT=${LITEADS_REDIS__PORT:-6379}
      - LITEADS_REDIS__PASSWORD=${LITEADS_REDIS__PASSWORD:-}
      - LITEADS_AUTH__JWT_SECRET=${LITEADS_AUTH__JWT_SECRET}
      - LITEADS_TRACKING__SECRET=${LITEADS_TRACKING__SECRET}
      - LAYA_BASE_URL=http://laya:8000
      - LITEADS_OPTIMIZATION__MODE=${LITEADS_OPTIMIZATION__MODE:-suggestions_only}
      - LITEADS_OPTIMIZATION__KILL_SWITCH=${LITEADS_OPTIMIZATION__KILL_SWITCH:-false}
      - LITEADS_OPTIMIZATION__INTERVAL_SECONDS=${LITEADS_OPTIMIZATION__INTERVAL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - liteads-network
    profiles:
      - worker


  # Notification Delivery Worker (dedicated worker process)
  notification-worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    command: ["python", "-m", "liteads.ad_server.services.notification_worker"]
    environment:
      - LITEADS_ENV=${LITEADS_ENV:-dev}
      - LITEADS_DATABASE__HOST=${LITEADS_DATABASE__HOST:-postgres}
      - LITEADS_DATABASE__PORT=${LITEADS_DATABASE__PORT:-5432}
      - LITEADS_DATABASE__NAME=${LITEADS_DATABASE__NAME:-liteads}
      - LITEADS_DATABASE__USER=${LITEADS_DATABASE__USER:-liteads}
      - LITEADS_DATABASE__PASSWORD=${LITEADS_DATABASE__PASSWORD:?LITEADS_DATABASE__PASSWORD must be set}
      - LITEADS_REDIS__HOST=${LITEADS_REDIS__HOST:-redis}
      - LITEADS_REDIS__PORT=${LITEADS_REDIS__PORT:-6379}
      - LITEADS_REDIS__PASSWORD=${LITEADS_REDIS__PASSWORD:-}
      - LITEADS_AUTH__JWT_SECRET=${LITEADS_AUTH__JWT_SECRET}
      - LITEADS_TRACKING__SECRET=${LITEADS_TRACKING__SECRET}
      - LITEADS_EMAIL__HOST=mailpit
      - LITEADS_EMAIL__PORT=1025
      - LITEADS_EMAIL__USER=
      - LITEADS_EMAIL__PASSWORD=
      - LITEADS_EMAIL__USE_TLS=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - liteads-network
    profiles:
      - worker


  # PostgreSQL Database
  postgres:
    image: postgres:15.8-alpine
    environment:
      POSTGRES_USER: ${LITEADS_DATABASE__USER:-${POSTGRES_USER:-liteads}}
      POSTGRES_PASSWORD: ${LITEADS_DATABASE__PASSWORD:?LITEADS_DATABASE__PASSWORD or POSTGRES_PASSWORD must be set and non-empty}
      POSTGRES_DB: ${LITEADS_DATABASE__NAME:-${POSTGRES_DB:-liteads}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT_BINDING:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITEADS_DATABASE__USER:-liteads} -d ${LITEADS_DATABASE__NAME:-liteads}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - liteads-network


  # Redis Cache
  redis:
    image: redis:7.2.6-alpine
    command: >
      sh -c '
        if [ -n "$$LITEADS_REDIS__PASSWORD" ]; then
          exec redis-server --requirepass "$$LITEADS_REDIS__PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        else
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      '
    environment:
      - LITEADS_REDIS__PASSWORD=${LITEADS_REDIS__PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_BINDING:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$LITEADS_REDIS__PASSWORD\" ]; then redis-cli -a \"$LITEADS_REDIS__PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - liteads-network


  # Mailpit for local email capture (Development only; bound to localhost)
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped
    networks:
      - liteads-network


  # Nginx Load Balancer (optional, for production)
  nginx:
    image: nginx:1.27.2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ad-server
    restart: unless-stopped
    networks:
      - liteads-network
    profiles:
      - production


  # Prometheus Monitoring (optional)
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - liteads-network


  # Laya optimization sidecar
  laya:
    build: https://github.com/NandhaKishorM/laya.git#c3e5a7b  # Pinned commit SHA
    command: ["laya-serve"]
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - LAYA_HOST=0.0.0.0
      - LAYA_PORT=8000
      - LAYA_PRELOAD=0
    ports:
      - "127.0.0.1:8100:8000"
    networks:
      - liteads-network
    restart: unless-stopped


  # Grafana Dashboard (optional)
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deployment/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - liteads-network
    profiles:
      - monitoring


  # ---------------------------------------------------------------------------
  # Optional Profile: email-marketing (Phase 6.1A)
  # ---------------------------------------------------------------------------


  # Listmonk Dedicated PostgreSQL Database
  listmonk-db:
    image: postgres:15-alpine
    container_name: liteads-listmonk-db
    environment:
      POSTGRES_USER: ${LISTMONK_DB__USER:-listmonk}
      POSTGRES_PASSWORD: ${LISTMONK_DB__PASSWORD:-}
      POSTGRES_DB: ${LISTMONK_DB__NAME:-listmonk}
    volumes:
      - listmonk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LISTMONK_DB__USER:-listmonk} -d ${LISTMONK_DB__NAME:-listmonk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - listmonk-internal
    profiles:
      - email-marketing


  # Listmonk Application Service
  listmonk:
    image: listmonk/listmonk:v4.1.0
    container_name: liteads-listmonk
    command: ["sh", "-c", "yes | ./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
    environment:
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_db__host=listmonk-db
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=${LISTMONK_DB__USER:-listmonk}
      - LISTMONK_db__password=${LISTMONK_DB__PASSWORD:-}
      - LISTMONK_db__database=${LISTMONK_DB__NAME:-listmonk}
      - LISTMONK_db__ssl_mode=disable
      - LISTMONK_ADMIN_USER=${LISTMONK_ADMIN__USERNAME:-admin}
      - LISTMONK_ADMIN_PASSWORD=${LISTMONK_ADMIN__PASSWORD:-}
      - LISTMONK_smtp__0__host=${LISTMONK_SMTP__HOST:-mailpit}
      - LISTMONK_smtp__0__port=${LISTMONK_SMTP__PORT:-1025}
      - LISTMONK_smtp__0__auth_protocol=none
      - LISTMONK_smtp__0__tls_type=none
    volumes:
      - listmonk_data:/listmonk/data
    ports:
      - "${LISTMONK_PORT_BINDING:-127.0.0.1:9000}:9000"
    depends_on:
      listmonk-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - liteads-network
      - listmonk-internal
    profiles:
      - email-marketing


volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  listmonk_db_data:
  listmonk_data:


networks:
  liteads-network:
    driver: bridge
  listmonk-internal:
    driver: bridge
    internal: true
