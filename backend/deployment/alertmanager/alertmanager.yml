# RivinityADS Alertmanager Configuration (P1-02)
# Severity-based routing with inhibition rules and runtime-injected webhook URLs.
# Zero secrets or real webhook endpoints are committed to git; Compose replaces the
# RFC 2606 `.invalid` placeholder URLs at container boot from environment variables
# ALERTMANAGER_CRITICAL_WEBHOOK_URL and ALERTMANAGER_WARNING_WEBHOOK_URL.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'worker_type', 'queue']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'warning-webhook'
  routes:
    - matchers:
        - severity =~ "critical|page"
      receiver: 'critical-pager'
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: 'warning-webhook'
      repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - severity =~ "critical|page"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'instance']
  - source_matchers:
      - alertname = "DatabaseDependencyUnreachable"
    target_matchers:
      - alertname =~ "OutboxProcessingBacklogHigh|DedicatedWorkerExecutionStalled|AdServerReadinessProbeFailed"

receivers:
  - name: 'critical-pager'
    webhook_configs:
      - url: 'http://alertmanager-webhook.invalid/critical'
        send_resolved: true
  - name: 'warning-webhook'
    webhook_configs:
      - url: 'http://alertmanager-webhook.invalid/warning'
        send_resolved: true
