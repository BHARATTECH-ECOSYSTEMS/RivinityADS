# Prometheus Alert Rules for RivinityADS (P1-02 Real Telemetry Alignment)
# Operational monitoring and alert definitions for Ad Server, dependencies, outbox, workers, and financial integrity.
#
# Rules conform to standard Prometheus v2 alert rule schema.
# Every expression references real metrics emitted by liteads or configured exporters/probes.

groups:
  - name: rivinity_ads_operational_alerts
    rules:
      # Alert 1: High HTTP 5xx Error Rate (> 1.0%)
      - alert: AdServerElevatedErrorRate
        expr: (sum(rate(liteads_http_requests_total{status=~"5.."}[5m])) / sum(rate(liteads_http_requests_total[5m]))) * 100 > 1.0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ad Server 5xx error rate is above 1% (current: {{ $value }}%)"
          description: "Elevated HTTP 5xx responses observed across API endpoints over the last 5 minutes."
          runbook_url: "docs/runbooks/11_monitoring_and_alerting.md#runbook-alerts-5xx"
          threshold_status: "operational_slo"

      # Alert 2: Ad Server High p95 Latency (> 500ms)
      - alert: AdServerP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(liteads_http_request_duration_seconds_bucket[5m])) by (le)) > 0.500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ad Server p95 latency is {{ $value }}s (> 500ms)"
          description: "Ad serving or event tracking p95 latency exceeds the 500ms production SLA over a 5-minute window."
          runbook_url: "docs/runbooks/06_suspicious_traffic.md"
          threshold_status: "operational_slo"

      # Alert 3: PostgreSQL Database Connection Failure (via postgres-exporter)
      - alert: DatabaseDependencyUnreachable
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is unreachable"
          description: "postgres-exporter reports pg_up == 0 or exporter target down."
          runbook_url: "docs/runbooks/03_database_restore.md"
          threshold_status: "deterministic_invariant"

      # Alert 4: Redis Cache/Rate-Limiter Connection Failure (via redis-exporter)
      - alert: RedisDependencyUnreachable
        expr: redis_up == 0 or up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis cache/rate-limiting instance is unreachable"
          description: "redis-exporter reports redis_up == 0 or exporter target down."
          runbook_url: "docs/runbooks/05_provider_outage.md"
          threshold_status: "deterministic_invariant"

      # Alert 5: Ad Server Readiness Probe Failure (via blackbox-exporter)
      - alert: AdServerReadinessProbeFailed
        expr: probe_success{job="blackbox-http", instance="http://ad-server:8000/health/ready"} == 0 or up{job="liteads"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ad Server readiness probe failed or target unreachable"
          description: "Blackbox HTTP probe to /health/ready failed or Prometheus cannot scrape ad-server:8000/metrics."
          runbook_url: "docs/runbooks/11_monitoring_and_alerting.md#runbook-alerts-readiness"
          threshold_status: "deterministic_invariant"

      # Alert 6: Outbox Backlog Age Exceeded (> 600s)
      - alert: OutboxProcessingBacklogHigh
        expr: liteads_outbox_oldest_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox queue {{ $labels.queue }} oldest pending item age is {{ $value }}s (>10m)"
          description: "Durable webhook or notification outbox queue is falling behind; events are not being processed within 10 minutes."
          runbook_url: "docs/runbooks/05_provider_outage.md"
          threshold_status: "operational_slo"

      # Alert 7: Outbox Dead-Letter Failure Spike (> 25 permanently failed jobs)
      - alert: OutboxDeadLetterSpike
        expr: liteads_outbox_failed_count > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Over 25 permanently failed outbox jobs in queue {{ $labels.queue }} (current: {{ $value }})"
          description: "High count of dead-lettered webhook/notification deliveries due to destination rejections, SSRF blocks, or retry exhaustion."
          runbook_url: "docs/runbooks/05_provider_outage.md"
          threshold_status: "provisional_baseline"

      # Alert 8: Dedicated Worker Heartbeat Missing / Worker Stalled (> 300s)
      - alert: DedicatedWorkerExecutionStalled
        expr: time() - liteads_worker_last_heartbeat_timestamp > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Worker heartbeat for {{ $labels.worker_type }} is missing for over 5 minutes"
          description: "Background worker container has stopped updating its Redis-synced heartbeat or crashed."
          runbook_url: "docs/runbooks/11_monitoring_and_alerting.md#runbook-alerts-workers"
          threshold_status: "operational_slo"

      # Alert 9: Spend / Revenue Mismatch & Ledger Drift
      - alert: FinancialLedgerDiscrepancy
        expr: liteads_ledger_unbalanced_transactions_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unbalanced financial ledger discrepancy detected during reconciliation!"
          description: "Double-entry reconciliation audit reported unbalanced transactions or wallet drift."
          runbook_url: "docs/runbooks/07_financial_reconciliation.md"
          threshold_status: "zero_tolerance_invariant"

      # Alert 10: Conversion Anomaly Spike (Potential Fraud / IVT)
      - alert: ConversionAnomalySpike
        expr: sum(increase(liteads_ad_conversions_total[10m])) > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sudden spike in conversion volume detected (> 200 conversions in 10m)"
          description: "High volume of conversion signals received in short duration; verify attribution and IVT logs."
          runbook_url: "docs/runbooks/06_suspicious_traffic.md"
          threshold_status: "provisional_anomaly"

      # Alert 11: Laya Sidecar High Timeout Rate (> 5.0%)
      - alert: LayaSidecarElevatedTimeouts
        expr: (sum(rate(liteads_laya_errors_total{error_category="timeout"}[10m])) / sum(rate(liteads_laya_requests_total[10m]))) * 100 > 5.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Laya sidecar timeout rate is above 5% over 10 minutes"
          description: "Laya AI decision sidecar is failing to respond within bounded timeout threshold during campaign optimization cycles."
          runbook_url: "docs/runbooks/05_provider_outage.md"
          threshold_status: "provisional_baseline"
