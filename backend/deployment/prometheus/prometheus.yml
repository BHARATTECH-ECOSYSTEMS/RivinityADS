# Prometheus Configuration for RivinityADS (P1-02)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # RivinityADS Ad Server (FastAPI /metrics + synced outbox & worker heartbeat gauges)
  - job_name: 'liteads'
    static_configs:
      - targets: ['ad-server:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis Exporter (authenticated PING & Redis cache/rate-limiter metrics)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL Exporter (DB connectivity & pg_stat telemetry)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Blackbox HTTP readiness probe against Ad Server
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://ad-server:8000/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
