  frontend-quality:
    name: Frontend Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Typecheck & Vite Production Build
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Automated Tests
        working-directory: frontend
        run: npm run test

  postgres-integration:
    name: PostgreSQL Concurrency & Ledger Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: liteads
          POSTGRES_PASSWORD: test_pg_password_safe
          POSTGRES_DB: liteads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liteads -d liteads"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: "backend"
      LITEADS_DATABASE__HOST: "localhost"
      LITEADS_DATABASE__PORT: "5432"
      LITEADS_DATABASE__USER: "liteads"
      LITEADS_DATABASE__PASSWORD: "test_pg_password_safe"
      LITEADS_DATABASE__NAME: "liteads"
      LITEADS_AUTH__JWT_SECRET: "test_jwt_secret_must_be_at_least_32_characters_long_for_validation"
      LITEADS_TRACKING__SECRET: "test_tracking_secret_must_be_at_least_32_characters_long_for_validation"
      TEST_DATABASE_URL: "postgresql://liteads:test_pg_password_safe@localhost:5432/liteads"
      TEST_TARGET_DATABASE_URL: "postgresql://liteads:test_pg_password_safe@localhost:5432/liteads_restore_target"
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install CPU PyTorch Wheel
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install Backend Dependencies
        run: |
          pip install -e "backend[dev]"

      - name: Run PostgreSQL Migration & Concurrency Verification
        run: |
          python backend/scripts/verify_postgres_phase11_concurrency.py

      - name: Prepare Migrated Source & Target PostgreSQL Databases
        env:
          PGPASSWORD: "test_pg_password_safe"
        run: |
          psql -h localhost -U liteads -d liteads -v ON_ERROR_STOP=1 -f backend/scripts/init_db.sql
          python -m alembic -c backend/alembic.ini upgrade head
          psql -h localhost -U liteads -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS liteads_restore_target;"
          psql -h localhost -U liteads -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE liteads_restore_target;"

      - name: Run Live PostgreSQL Integration & Backup/Restore Pytest Suites
        run: |
          pytest \
            backend/tests/test_ad_server/test_phase5_postgres_concurrency.py \
            backend/tests/test_scripts/test_backup_restore.py \
            backend/tests/test_api/test_phase1_financial_integrity.py \
            backend/tests/test_api/test_phase5_financial_pipeline.py \
            -v --tb=short

  e2e-browser-quality:
    name: Playwright Real-Browser E2E Security Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Security Suite (Chromium)
        working-directory: frontend
        run: npm run test:e2e:chromium

      - name: Upload Playwright Test Report Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
