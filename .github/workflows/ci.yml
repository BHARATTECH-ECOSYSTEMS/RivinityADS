name: RivinityADS CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Regression Gates
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "backend"
      LITEADS_AUTH__JWT_SECRET: "test_jwt_secret_must_be_at_least_32_characters_long_for_validation"
      LITEADS_TRACKING__SECRET: "test_tracking_secret_must_be_at_least_32_characters_long_for_validation"
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install CPU PyTorch Wheel
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install Backend Dependencies
        run: |
          pip install -e "backend[dev]"

      - name: Validate Alembic Migration Head
        run: |
          EXPECTED_HEAD=$(python -m liteads.common.alembic_utils | tail -n 1)
          echo "Authoritative Alembic Head from Graph: $EXPECTED_HEAD"
          HEAD_OUTPUT=$(python -m alembic -c backend/alembic.ini heads)
          echo "Current Alembic Head: $HEAD_OUTPUT"
          if [[ "$HEAD_OUTPUT" != *"$EXPECTED_HEAD"* ]]; then
            echo "ERROR: Expected migration head $EXPECTED_HEAD, got: $HEAD_OUTPUT"
            exit 1
          fi
          HEAD_COUNT=$(echo "$HEAD_OUTPUT" | grep -v '^[[:space:]]*$' | wc -l)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Multiple migration heads detected!"
            exit 1
          fi

      - name: Validate Prometheus Alert Rules & Monitoring Config
        run: |
          python backend/scripts/validate_alert_rules.py

      - name: Validate Prometheus, Alertmanager & Production Compose Config
        run: |
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/backend/deployment/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "${{ github.workspace }}/backend/deployment/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 check rules /etc/prometheus/alert_rules.yml
          docker run --rm --entrypoint amtool \
            -v "${{ github.workspace }}/backend/deployment/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml
          TMP_ENV=$(mktemp)
          trap 'rm -f "$TMP_ENV"' EXIT
          cp backend/.env.example "$TMP_ENV"
          cat >> "$TMP_ENV" <<'EOF'
          LITEADS_DATABASE__PASSWORD=ci_compose_validation_db_pass
          LITEADS_REDIS__PASSWORD=ci_compose_validation_redis_pass
          LITEADS_AUTH__JWT_SECRET=ci_compose_validation_jwt_secret_at_least_32_chars
          LITEADS_TRACKING__SECRET=ci_compose_validation_tracking_secret_at_least_32
          LITEADS_SERVER__FRONTEND_URL=https://ads.example.com
          GRAFANA_ADMIN_PASSWORD=ci_compose_validation_grafana_pass
          EOF
          docker compose --env-file "$TMP_ENV" -f backend/docker-compose.prod.yml config --quiet

      - name: Run Full Unit & Regression Pytest Corpus (109 Suites)
        run: |
          pytest \
            backend/tests/test_ml_engine/test_features.py \
            backend/tests/test_ml_engine/test_models.py \
            backend/tests/test_rec_engine/test_affinity_ranking.py \
            backend/tests/test_rec_engine/test_engine.py \
            backend/tests/test_rec_engine/test_filters.py \
            backend/tests/test_scripts/test_backup_restore.py \
            backend/tests/test_scripts/test_ci_and_security_automation.py \
            backend/tests/test_scripts/test_docs_and_compose_consistency.py \
            backend/tests/test_scripts/test_monitoring_and_alerts.py \
            backend/tests/test_ad_server/test_ad.py \
            backend/tests/test_ad_server/test_auth_regression.py \
            backend/tests/test_ad_server/test_autopilot_api.py \
            backend/tests/test_ad_server/test_billing.py \
            backend/tests/test_ad_server/test_budget_concurrency.py \
            backend/tests/test_ad_server/test_bug5_rate_limits.py \
