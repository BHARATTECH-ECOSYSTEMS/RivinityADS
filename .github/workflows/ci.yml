name: RivinityADS CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality & Regression Gates
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "backend"
      LITEADS_AUTH__JWT_SECRET: "test_jwt_secret_must_be_at_least_32_characters_long_for_validation"
      LITEADS_TRACKING__SECRET: "test_tracking_secret_must_be_at_least_32_characters_long_for_validation"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install CPU PyTorch Wheel
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install Backend Dependencies
        run: |
          pip install -e "backend[dev]"

      - name: Validate Alembic Migration Head
        run: |
          EXPECTED_HEAD=$(python -m liteads.common.alembic_utils | tail -n 1)
          echo "Authoritative Alembic Head from Graph: $EXPECTED_HEAD"
          HEAD_OUTPUT=$(python -m alembic -c backend/alembic.ini heads)
          echo "Current Alembic Head: $HEAD_OUTPUT"
          if [[ "$HEAD_OUTPUT" != *"$EXPECTED_HEAD"* ]]; then
            echo "ERROR: Expected migration head $EXPECTED_HEAD, got: $HEAD_OUTPUT"
            exit 1
          fi
          HEAD_COUNT=$(echo "$HEAD_OUTPUT" | grep -v '^[[:space:]]*$' | wc -l)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Multiple migration heads detected!"
            exit 1
          fi

      - name: Run Core & Regression Pytest Suites
        run: |
          pytest backend/tests/test_ad_server/test_health.py \
                 backend/tests/test_ad_server/test_ad.py \
                 backend/tests/test_api/test_phase0_migration_truthfulness.py \
                 backend/tests/test_api/test_phase1_visitor_consent.py \
                 backend/tests/test_api/test_phase1_visitor_consent_gate.py \
                 backend/tests/test_api/test_phase2_channel_conformance.py \
                 backend/tests/test_api/test_phase3_publisher_verification.py \
                 backend/tests/test_api/test_phase4_advertiser_campaign_readiness.py \
                 backend/tests/test_api/test_phase7_ad_quality_and_admin_ops.py \
                 backend/tests/test_api/test_phase11_conversion_measurement.py \
                 backend/tests/test_api/test_phase10f_monetization_consent.py \
                 backend/tests/test_api/test_phase10g_security_e2e.py \
                 backend/tests/test_api/test_phase9_3_persistence_lifecycle.py \
                 backend/tests/test_api/test_finance_api.py \
                 backend/tests/test_api/test_phase5_financial_event_pipeline_proof.py \
                 backend/tests/test_api/test_phase6_laya_decision_hardening.py \
                 backend/tests/test_api/test_phase8_ml_governance.py \
                 -v --tb=short

  frontend-quality:
    name: Frontend Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Typecheck & Vite Production Build
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Automated Tests
        working-directory: frontend
        run: npm run test

  postgres-integration:
    name: PostgreSQL Concurrency & Ledger Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: liteads
          POSTGRES_PASSWORD: test_pg_password_safe
          POSTGRES_DB: liteads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liteads -d liteads"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LITEADS_DATABASE__HOST: "localhost"
      LITEADS_DATABASE__PORT: "5432"
      LITEADS_DATABASE__USER: "liteads"
      LITEADS_DATABASE__PASSWORD: "test_pg_password_safe"
      LITEADS_DATABASE__NAME: "liteads"
      LITEADS_AUTH__JWT_SECRET: "test_jwt_secret_must_be_at_least_32_characters_long_for_validation"
      LITEADS_TRACKING__SECRET: "test_tracking_secret_must_be_at_least_32_characters_long_for_validation"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install CPU PyTorch Wheel
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install Backend Dependencies
        run: |
          pip install -e "backend[dev]"

      - name: Run PostgreSQL Migration & Concurrency Verification
        run: |
          python backend/scripts/verify_postgres_phase11_concurrency.py

  e2e-browser-quality:
    name: Playwright Real-Browser E2E Security Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Security Suite (Chromium)
        working-directory: frontend
        run: npm run test:e2e:chromium

      - name: Upload Playwright Test Report Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
